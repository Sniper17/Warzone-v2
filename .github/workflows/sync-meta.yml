name: Sincronizar meta do Warzone

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          pip install -r requirements.txt

      - name: Sincronizar dados
        run: python updater.py

      - name: Salvar alterações
        run: |
          git config user.name "warzone-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.json
          git diff --cached --quiet || git commit -m "chore: sincronizar dados do Warzone"
          git push
